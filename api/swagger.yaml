openapi: 3.0.3
info:
  title: QuickSanta API
  version: 1.0.0
  description: |
    Single serverless function (api/index.ts). Auth = HttpOnly cookie `qs_sid` from passwordless OTP.
    Workspace routes resolve the tenant from `X-Tenant-Id` (or the session's active tenant).
    Errors: `{ error: "<i18n key>" }`. Grid endpoints accept page, limit (≤100), sort_by, sort_dir (ASC|DESC), q, and whitelisted filters,
    and return `{ ok, items, pagination: { page, limit, total, totalPages } }`.
servers:
  - url: /
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: qs_sid
  parameters:
    TenantHeader: { name: X-Tenant-Id, in: header, required: false, schema: { type: integer } }
    page: { name: page, in: query, schema: { type: integer, minimum: 1 } }
    limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
    sort_by: { name: sort_by, in: query, schema: { type: string } }
    sort_dir: { name: sort_dir, in: query, schema: { type: string, enum: [ASC, DESC] } }
    q: { name: q, in: query, schema: { type: string, maxLength: 80 } }
  schemas:
    Error: { type: object, properties: { error: { type: string, example: errors.forbidden } } }
    Pagination: { type: object, properties: { page: { type: integer }, limit: { type: integer }, total: { type: integer }, totalPages: { type: integer } } }
paths:
  /api/health:
    get:
      tags: [Public]
      summary: GET /api/health
      responses:
        '200': { description: OK }
        '4XX': { description: Error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/event-types:
    get:
      tags: [Public]
      summary: Active service catalog (Secret Santa, white elephant, …)
      responses:
        '200': { description: OK }
  /api/auth/otp/request:
    post:
      tags: [Auth]
      summary: POST /api/auth/otp/request
      requestBody: { content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { description: OK }
        '4XX': { description: Error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/auth/otp/verify:
