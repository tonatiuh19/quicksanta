  /api/auth/switch-tenant:
    post:
      tags: [Auth]
      summary: POST /api/auth/switch-tenant
      description: "Guard: requireAuth()"
      security: [{ session: [] }]
      requestBody: { content: { application/json: { schema: { type: object } } } }
