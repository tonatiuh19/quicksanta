      tags: [Billing]
      summary: Start (or resume an unfinished) Pro subscription on STRIPE_PLATFORM_PRICE_ID; returns the first invoice client_secret
      description: "Guard: requireTenant(members.manage)"
      security: [{ session: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      responses:
        '200': { description: OK }
        '4XX': { description: Error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/app/billing/sync:
    post:
      tags: [Billing]
      summary: Re-read the subscription from Stripe and mirror it on the workspace (opens pending exchanges when Pro)
      description: "Guard: requireTenant(members.manage)"
      security: [{ session: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      responses:
        '200': { description: OK }
        '4XX': { description: Error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/app/billing/payment-method/setup:
    post:
      tags: [Billing]
      summary: SetupIntent client_secret for updating the card
      description: "Guard: requireTenant(members.manage)"
      security: [{ session: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      responses:
        '200': { description: OK }
        '4XX': { description: Error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/app/billing/payment-method:
    post:
      tags: [Billing]
      summary: Set the default card on customer + subscription; retries a past_due invoice. Body { payment_method_id }
      description: "Guard: requireTenant(members.manage)"
      security: [{ session: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      requestBody: { content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { description: OK }
        '4XX': { description: Error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/app/billing/save-offer:
    post:
      tags: [Billing]
      summary: Retention offer: one-time % off next invoice (once per workspace)
      description: "Guard: requireTenant(members.manage)"
      security: [{ session: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      responses:
        '200': { description: OK }
        '4XX': { description: Error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/app/billing/cancel:
    post:
      tags: [Billing]
      summary: Cancel at period end. Body { reason, feedback?, confirm_name } (must equal the workspace name)
      description: "Guard: requireTenant(members.manage)"
      security: [{ session: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      requestBody: { content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { description: OK }
        '4XX': { description: Error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/app/billing/resume:
    post:
      tags: [Billing]
      summary: Undo a scheduled cancellation
      description: "Guard: requireTenant(members.manage)"
      security: [{ session: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      responses:
        '200': { description: OK }
        '4XX': { description: Error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/admin/payments:
    get:
      tags: [Command Center]
      summary: Payments grid (server-side filter/sort/search/paging)
      description: "Guard: requirePlatform(payments.read)"
      security: [{ session: [] }]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/sort_by'
        - $ref: '#/components/parameters/sort_dir'
        - $ref: '#/components/parameters/q'
      responses:
        '200': { description: OK }
  /api/app/templates:
    get:
      tags: [Workspace]
      summary: Saved "Create your own" designs of this workspace
      description: "Guard: requireTenant(events.manage)"
      security: [{ session: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantHeader'
      responses:
        '200': { description: OK }
  /api/app/templates/{id}:
    delete:
      tags: [Workspace]
      summary: Delete a saved design
      description: "Guard: requireTenant(events.manage)"
      security: [{ session: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/TenantHeader'
      responses:
        '200': { description: OK }
        '4XX': { description: Error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
